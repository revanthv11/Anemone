# The App Review demo server: Jellyfin, with the media fetch-media.sh downloads mounted read-only.
# docs/release/review-server.md walks through it.
#
#   docker compose up -d                   plain HTTP on port 8096 (REVIEW_SERVER_PORT to move it)
#   docker compose --profile https up -d   also Caddy on 80 and 443, with a Let's Encrypt
#                                          certificate for $REVIEW_SERVER_HOST (from .env)
#
# Jellyfin's state is in config/ and cache/ next to this file. Pin a new Jellyfin version here
# deliberately, and run check.sh after moving to it.

services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: anemone-review-jellyfin
    restart: unless-stopped
    ports:
      - "${REVIEW_SERVER_BIND:-0.0.0.0}:${REVIEW_SERVER_PORT:-8096}:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media:ro

  caddy:
    image: caddy:2
    container_name: anemone-review-caddy
    profiles: [https]
    restart: unless-stopped
    depends_on: [jellyfin]
    ports:
      - "80:80"
      - "443:443"
    environment:
      REVIEW_SERVER_HOST: "${REVIEW_SERVER_HOST:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
