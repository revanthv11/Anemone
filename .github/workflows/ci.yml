name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.6.app
  SWIFTLINT_VERSION: 0.65.1
  SWIFTFORMAT_VERSION: 0.64.1

jobs:
  # Linux, so lint doesn't take one of the account's macOS runners.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The SwiftLint zip's other binary, swiftlint-static, is built without SourceKit.
      - name: Install SwiftLint and SwiftFormat
        run: |
          curl -sSfLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          curl -sSfLo swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          unzip -q swiftlint.zip swiftlint -d "$RUNNER_TEMP/swiftlint"
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          mv "$RUNNER_TEMP/swiftformat/swiftformat_linux" "$RUNNER_TEMP/swiftformat/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint" "$RUNNER_TEMP/swiftformat/swiftformat"
          rm swiftlint.zip swiftformat.zip
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: SwiftFormat
        run: swiftformat --lint .
      # SwiftLint loads SourceKit from the runner image's Swift toolchain. If it can't use it, it skips
      # the rules that need it (statement_position) with only a warning, so that fails the job too.
      - name: SwiftLint
        shell: bash
        run: |
          swiftlint lint --strict 2>&1 | tee "$RUNNER_TEMP/swiftlint.log"
          if grep -E "requires SourceKit|SourceKit-based rules will be skipped" "$RUNNER_TEMP/swiftlint.log"; then
            echo "::error::SwiftLint skipped the rules that need SourceKit."
            exit 1
          fi

  # TEMPORARY, removed before merging: the old macOS lint job, to compare its output with Linux's.
  lint-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint and SwiftFormat
        run: |
          curl -sSfLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          curl -sSfLo swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          rm swiftlint.zip swiftformat.zip
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --strict

  # TEMPORARY, removed before merging: the Linux job without SourceKit and without the violations,
  # to check that the SourceKit guard fails it.
  lint-no-sourcekit:
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_DISABLE_SOURCEKIT: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Remove the deliberate violations
        run: rm Packages/AnemoneKit/Sources/AnemoneCore/LintCheck.swift
      - name: Install SwiftLint
        run: |
          curl -sSfLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          unzip -q swiftlint.zip swiftlint -d "$RUNNER_TEMP/swiftlint"
          chmod +x "$RUNNER_TEMP/swiftlint/swiftlint"
          rm swiftlint.zip
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: SwiftLint
        shell: bash
        run: |
          swiftlint lint --strict 2>&1 | tee "$RUNNER_TEMP/swiftlint.log"
          if grep -E "requires SourceKit|SourceKit-based rules will be skipped" "$RUNNER_TEMP/swiftlint.log"; then
            echo "::error::SwiftLint skipped the rules that need SourceKit."
            exit 1
          fi

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Package tests
        run: swift test --package-path Packages/AnemoneKit

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Build tvOS app
        run: >
          xcodebuild build
          -project Anemone.xcodeproj
          -scheme Anemone
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  # The build and tests with Seerr on, which the jobs above leave out (docs/seerr.md).
  seerr:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_PATH"
      - name: Package tests with Seerr
        run: swift test --package-path Packages/AnemoneKit --traits ANEMONE_SEERR
      - name: Build tvOS app with Seerr
        env:
          ANEMONE_SEERR: "1"
        run: >
          xcodebuild build
          -project Anemone.xcodeproj
          -scheme Anemone
          -destination 'generic/platform=tvOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ANEMONE_SEERR'
