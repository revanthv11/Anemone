name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.6.app
  SWIFTLINT_VERSION: 0.65.1
  SWIFTFORMAT_VERSION: 0.64.1

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint and SwiftFormat
        run: |
          curl -sSfLo swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          curl -sSfLo swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          unzip -q swiftformat.zip -d "$RUNNER_TEMP/swiftformat"
          rm swiftlint.zip swiftformat.zip
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: SwiftFormat
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --strict

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            Packages/AnemoneKit/.build/repositories
            Packages/AnemoneKit/.build/checkouts
            Packages/AnemoneKit/.build/artifacts
            Packages/AnemoneKit/.build/workspace-state.json
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/AnemoneKit/Package.resolved') }}
      - name: Package tests
        run: swift test --package-path Packages/AnemoneKit

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: xcode-packages-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-${{ hashFiles('Anemone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/AnemoneKit/Package.resolved') }}
      - name: Build tvOS app
        run: >
          xcodebuild build
          -project Anemone.xcodeproj
          -scheme Anemone
          -destination 'generic/platform=tvOS Simulator'
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          CODE_SIGNING_ALLOWED=NO

  # The build and tests with Seerr on, which the jobs above leave out (docs/seerr.md). They're two
  # jobs so the tests and the build run side by side.
  seerr-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            Packages/AnemoneKit/.build/repositories
            Packages/AnemoneKit/.build/checkouts
            Packages/AnemoneKit/.build/artifacts
            Packages/AnemoneKit/.build/workspace-state.json
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/AnemoneKit/Package.resolved') }}
      - name: Package tests with Seerr
        run: swift test --package-path Packages/AnemoneKit --traits ANEMONE_SEERR

  seerr-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: xcode-packages-${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-${{ hashFiles('Anemone.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/AnemoneKit/Package.resolved') }}
      - name: Build tvOS app with Seerr
        env:
          ANEMONE_SEERR: "1"
        run: >
          xcodebuild build
          -project Anemone.xcodeproj
          -scheme Anemone
          -destination 'generic/platform=tvOS Simulator'
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          CODE_SIGNING_ALLOWED=NO
          'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ANEMONE_SEERR'
